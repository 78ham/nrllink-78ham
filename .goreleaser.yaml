version: 2

project_name: nrllink

before:
  hooks:
    - apk add --no-cache gcc musl-dev pkgconf opus-dev opusfile-dev cmake make git
    - git clone --depth 1 https://github.com/drowe67/codec2.git codec2-src
    - mkdir -p codec2-src/build && cd codec2-src/build && cmake .. -DCMAKE_BUILD_TYPE=Release && make -j$(nproc)
    - mkdir -p codec2/src/codec2 && cp codec2-src/src/*.h codec2/src/codec2/
    - find codec2-src/build -name "version.h" -exec cp {} codec2/src/codec2/ \;
    - mkdir -p codec2/build/src && cp codec2-src/build/src/libcodec2.so* codec2/build/src/

builds:
  - env: [CGO_ENABLED=1]
    goos:
      - linux
    goarch:
      - amd64

dockers:
  - image_templates:
      - "ghcr.io/78ham/nrllink:{{ .Version }}"
      - "ghcr.io/78ham/nrllink:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=Radio over network.
      - --label=org.opencontainers.image.url=https://github.com/78ham/nrllink-78ham
      - --label=org.opencontainers.image.source=https://github.com/78ham/nrllink-78ham
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=MIT

nfpms:
  - maintainer: BH4RPN <caoc@live.com>
    description: Radio over network.
    homepage: https://github.com/78ham/nrllink-78ham
    license: MIT
    formats:
      - deb
      - rpm
      - apk

snapcrafts:
  - name: nrllink
    summary: Radio over network.
    description: |
      NRLLINK enables radio communication over a network.
    confinement: strict
    grade: stable
