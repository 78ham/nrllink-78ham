# NRL Link 后端容器（可选，单独跑后端用）
#
# 完整部署请用前端仓库 nrllink-web-78ham 的编排：那里包含前端容器 + 后端容器，
# 同一编排、同一网络组（nrllink-net），前端对公网开放、后端接口对局域网、60050/udp 对公网。
# 本文件仅用于「只跑后端」的场景（调试接口 / 只做设备接入）。
#
# 端口：
#   API_PORT  9000/tcp  后端接口
#   UDP_PORT  60050/udp 设备接入，需公网放通
#
# 常用命令：
#   docker compose up -d
#   docker compose logs -f nrllink   # 首次部署的管理员密码在这里
#   docker compose down

services:
  nrllink:
    image: ${NRL_IMAGE:-ghcr.io/78ham/nrllink:latest}
    container_name: nrllink-server
    environment:
      NRL_DBFILE: /nrllink/data/udphub.sqlite3
      NRL_WEBPATH: /nrllink/www
      NRL_TOKEN_KEY: ${TOKEN_KEY:-}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-9000}:9000"
      - "${UDP_PORT:-60050}:60050/udp"
    volumes:
      - nrllink-data:/nrllink/data
      - nrllink-uploads:/nrllink/www/uploads
      # 可选：自定义平台名 / ICP / APRS / 微信 等配置时取消注释并准备 config/udphub.yaml
      # - ./config/udphub.yaml:/nrllink/conf/udphub.yaml:ro
    networks:
      - nrllink-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/platform/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # 单独跑后端时用项目级网络，避免与前端仓库编排的同名网络冲突
  nrllink-net:
    driver: bridge

volumes:
  nrllink-data:    # SQLite 数据库
  nrllink-uploads: # 后台上传的图片等运行期文件