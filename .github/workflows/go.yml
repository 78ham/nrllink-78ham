name: Go

on:
  push:
    branches: [ sqlite ]
  pull_request:
    branches: [ sqlite ]

jobs:
      
  release:
    name: Release on GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v1

      - name: Validates GO releaser config
        uses: docker://goreleaser/goreleaser:latest
        with:
          args: check

      - name: Build snapshot
        uses: docker://goreleaser/goreleaser:latest
        with:
          args: release --snapshot
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
